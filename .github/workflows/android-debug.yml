name: debug-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - name: firebase config
        run: |
          if [ ! -f app/google-services.json ] && [ -f app/google-services.json.example ]; then cp app/google-services.json.example app/google-services.json; fi
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: zorotsu-debug, path: app/build/outputs/apk/debug/*.apk }
